[metadata]
name = Wan2.1
author = Wan-Video
version = 0.1.0
url = http://github.com/Wan-Video/Wan2.1
description = Wan2.1 - Video generation project
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE.txt

classifiers =
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Topic :: Multimedia :: Video
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find:
install_package_data = True
python_requires = >=3.8
install_requires =
    opencv-python>=4.9.0.80
    diffusers>=0.31.0
    accelerate>=1.1.1
    imageio
    easydict
    ftfy
    dashscope
    imageio-ffmpeg
    flash_attn; platform_system == "linux"
    # Windows Flash Attn builds from https://huggingface.co/lldacing/flash-attention-windows-wheel
    https://huggingface.co/lldacing/flash-attention-windows-wheel/resolve/main/flash_attn-2.7.4%2Bcu124torch2.6.0cxx11abiFALSE-cp310-cp310-win_amd64.whl; platform_system == "windows" and python_version >= "3.10" and python_version < "3.11"
    https://huggingface.co/lldacing/flash-attention-windows-wheel/resolve/main/flash_attn-2.7.4%2Bcu126torch2.6.0cxx11abiFALSE-cp311-cp311-win_amd64.whl; platform_system == "windows" and python_version >= "3.11" and python_version < "3.12"
    https://huggingface.co/lldacing/flash-attention-windows-wheel/resolve/main/flash_attn-2.7.4%2Bcu126torch2.6.0cxx11abiFALSE-cp312-cp312-win_amd64.whl; platform_system == "windows" and python_version >= "3.12" and python_version < "3.13"


    # Duplicated Deps with ComfyUI
    # torch>=2.4.0
    # torchvision>=0.19.0
    # transformers>=4.49.0
    # tokenizers>=0.20.3
    # tqdm
    # numpy==1.24.4
    # gradio>=5.0.0

[options.extras_require]
dev =
    pytest
    wheel
    setuptools
    build
docs =
    sphinx
    numpydoc
    myst-parser


[options.entry_points]
# console_scripts =
#     wan2_process = wan_package.module:function